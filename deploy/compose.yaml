# Midday self-hosting stack.
#   cp .env.example .env && ./generate-secrets.sh && docker compose up -d
# Optional profiles: s3 (Garage object store), ai (Ollama), dev (Mailpit).
name: midday

x-app: &app
  env_file: .env
  restart: unless-stopped
  environment: &app-env
    NODE_ENV: production
    DATABASE_URL: postgres://midday:${POSTGRES_PASSWORD:?run generate-secrets.sh}@postgres:5432/midday
    REDIS_URL: redis://valkey:6379
    API_INTERNAL_URL: http://api:8080
    STORAGE_LOCAL_DIR: /data/storage

x-bun-health: &bun-health
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: midday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run generate-secrets.sh}
      POSTGRES_DB: midday
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U midday -d midday"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: applies pending migrations (advisory-locked, idempotent).
  migrate:
    <<: *app
    image: ghcr.io/${MIDDAY_OWNER:-midday-app}/midday-api:${MIDDAY_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: "no"
    working_dir: /app/packages/db
    command: ["bun", "/app/node_modules/varlock/bin/cli.js", "run", "--", "bun", "run", "src/scripts/migrate.ts"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app
    image: ghcr.io/${MIDDAY_OWNER:-midday-app}/midday-api:${MIDDAY_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    volumes:
      - storage-data:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      <<: *bun-health
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  worker:
    <<: *app
    image: ghcr.io/${MIDDAY_OWNER:-midday-app}/midday-worker:${MIDDAY_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    volumes:
      - storage-data:/data/storage
    depends_on:
      migrate: { condition: service_completed_successfully }
      valkey: { condition: service_healthy }
    healthcheck:
      <<: *bun-health
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  dashboard:
    <<: *app
    image: ghcr.io/${MIDDAY_OWNER:-midday-app}/midday-dashboard:${MIDDAY_VERSION:-latest}
    build:
      context: ..
      dockerfile: apps/dashboard/Dockerfile
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      <<: *bun-health
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      CADDY_SCHEME: ${CADDY_SCHEME:-}
      # Hosts Caddy serves. Default to app.$DOMAIN and api.$DOMAIN.
      APP_HOST: ${APP_HOST:-app.${DOMAIN:?set DOMAIN or APP_HOST in .env}}
      API_HOST: ${API_HOST:-api.${DOMAIN:?set DOMAIN or API_HOST in .env}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      dashboard: { condition: service_healthy }
      api: { condition: service_healthy }

  # --- profile: s3 -----------------------------------------------------------
  # Set STORAGE_DRIVER=s3, S3_ENDPOINT=http://garage:3900, S3_REGION=garage,
  # S3_BUCKET=midday, S3_FORCE_PATH_STYLE=true and the S3_* keys (see .env.example).
  garage:
    profiles: [s3]
    image: dxflrs/garage:v1.1.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?run generate-secrets.sh}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?run generate-secrets.sh}
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data

  # One-shot: assigns the layout, creates the bucket and imports the S3_* key.
  garage-init:
    profiles: [s3]
    image: alpine:3.20
    restart: "no"
    env_file: .env
    environment:
      GARAGE_ADMIN_URL: http://garage:3903
    volumes:
      - ./garage-init.sh:/garage-init.sh:ro
    command: ["sh", "/garage-init.sh"]
    depends_on: [garage]

  # --- profile: ai -----------------------------------------------------------
  # Pull models once:
  #   docker compose exec ollama ollama pull nomic-embed-text
  #   docker compose exec ollama ollama pull <vision model, e.g. qwen2.5vl:7b>
  # Then set AI_PROVIDER=openai-compatible, AI_BASE_URL=http://ollama:11434/v1,
  # AI_MODEL_CHAT/VISION, AI_EMBEDDING_MODEL=nomic-embed-text.
  ollama:
    profiles: [ai]
    image: ollama/ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  # --- profile: dev ----------------------------------------------------------
  # SMTP_URL=smtp://mailpit:1025; inbox UI on http://localhost:${MAILPIT_PORT}
  mailpit:
    profiles: [dev]
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_PORT:-8025}:8025"

volumes:
  postgres-data:
  valkey-data:
  storage-data:
  caddy-data:
  caddy-config:
  garage-meta:
  garage-data:
  ollama-data:
