name: Desktop

# Unsigned macOS builds of the desktop app for Apple Silicon and Intel. Pushing
# a desktop-v* tag attaches the DMGs to a GitHub release; a manual run only
# uploads them as workflow artifacts. The apps are ad-hoc signed, not
# notarized: on first launch macOS asks to approve them under System Settings >
# Privacy & Security > Open Anyway.

permissions:
  contents: read

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: macos-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple Silicon runner.
          - arch: x64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: ${{ matrix.target }}

      # The DMG step scripts Finder and fails intermittently; a retry reuses
      # the compiled app and only redoes the bundling.
      - name: Build
        run: |
          build() { bun run tauri:build -- --target ${{ matrix.target }} --bundles app,dmg; }
          build || build
        working-directory: apps/desktop

      - name: Check architecture
        run: |
          binary=src-tauri/target/${{ matrix.target }}/release/bundle/macos/Midday.app/Contents/MacOS/Midday
          lipo -archs "$binary"
          lipo -archs "$binary" | grep -qx "${{ matrix.target == 'x86_64-apple-darwin' && 'x86_64' || 'arm64' }}"
          codesign --verify --deep --strict src-tauri/target/${{ matrix.target }}/release/bundle/macos/Midday.app
        working-directory: apps/desktop

      - uses: actions/upload-artifact@v4
        with:
          name: midday-desktop-${{ matrix.arch }}
          path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the app version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          if [ "desktop-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: midday-desktop-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          name: Midday Desktop ${{ github.ref_name }}
          files: dist/*.dmg
          generate_release_notes: true
          body: |
            Unsigned macOS builds. Download the `aarch64` DMG for Apple Silicon or the `x64` DMG for Intel Macs.

            On first launch macOS blocks the app: open System Settings > Privacy & Security and click **Open Anyway**.
