name: E2E

# Drives a real docker compose deployment with Playwright. Slow (builds the
# images), so it only runs on demand.

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.mode }} (compose)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # zero-config: defaults only (local storage, mail to the logs).
        # full: s3 (Garage) + dev (Mailpit) profiles, STORAGE_DRIVER=s3.
        mode: [zero-config, full]
    steps:
      # Building all the images on one runner fills its default disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - uses: docker/setup-buildx-action@v3

      - name: Start the stack
        run: e2e/stack.sh up ${{ matrix.mode == 'full' && 'full' || '' }}

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: e2e

      - name: Run the suite
        run: bun run e2e
        working-directory: e2e
        env:
          E2E_APP_URL: http://app.lvh.me:8080
          E2E_API_URL: http://api.lvh.me:8080
          E2E_MAILPIT_URL: ${{ matrix.mode == 'full' && 'http://localhost:8025' || '' }}

      - name: Compose logs
        if: failure()
        run: docker compose -p midday-e2e logs --tail 300
        working-directory: deploy

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.mode }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: e2e/stack.sh down
