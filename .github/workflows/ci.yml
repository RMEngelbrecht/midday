name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres-test:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: midday_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis-test:
        image: valkey/valkey:8
        ports:
          - 6379:6379
    env:
      NODE_OPTIONS: "--max-old-space-size=8192"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5433/midday_test
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - name: Setup test database schema
        run: DATABASE_URL=$TEST_DATABASE_URL APP_ENV=test bun run migrate
        working-directory: packages/db

      - name: Lint
        run: bunx turbo lint

      - name: Check hardcoded URLs
        run: bun run lint:urls

      - name: Build required type dependencies
        run: bunx turbo build --filter=workbench

      - name: Typecheck
        run: bunx turbo typecheck

      - name: Test
        run: bunx turbo test

  images:
    name: Build images (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        service: [api, worker, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
